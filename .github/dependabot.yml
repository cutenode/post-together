# Weekly dependency updates. A bump to anything bundled into dist/action.js (the runtime
# dependencies and the @actions/core dev dependency) changes the bundle, so the check-dist
# workflow fails on those pull requests until it is rebuilt (`npm run build:action`) and
# committed on the Dependabot branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
